<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Timer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b35; --text: #e8eaf0; --muted: #8a92a3;
    --accent: #4f8cff; --hold: #ff5a5f; --ready: #2ecc71; --warn: #f5a623;
  }
  :root { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f4f5f8; --panel: #ffffff; --line: #e1e4ea; --text: #1b1e25; --muted: #6b7280; color-scheme: light; }
  }
  :root[data-theme="light"] { --bg: #f4f5f8; --panel: #ffffff; --line: #e1e4ea; --text: #1b1e25; --muted: #6b7280; color-scheme: light; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.confirm { background: var(--hold); border-color: var(--hold); color: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100%;
    -webkit-user-select: none; user-select: none;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  select, button {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  label.toggle { display: flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); }

  #scrambleBar { padding-block: 18px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; }
  #scramble {
    font: 600 clamp(16px, 2.4vw, 24px)/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    word-spacing: 4px; max-width: 980px; margin: 0 auto;
  }
  #scrambleBar .row { margin-top: 8px; display: flex; gap: 8px; justify-content: center; }
  #scrambleBar button { font-size: 13px; padding: 4px 10px; }

  #stage {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 260px; cursor: pointer; touch-action: none;
  }
  #time {
    font: 700 clamp(64px, 16vw, 168px)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; transition: color .08s;
  }
  #time.hold { color: var(--hold); }
  #time.ready { color: var(--ready); }
  #time.inspect { color: var(--warn); }
  #hint { color: var(--muted); margin-top: 14px; font-size: 14px; text-align: center; }
  #lastActions { margin-top: 14px; display: flex; gap: 8px; visibility: hidden; }
  #lastActions.show { visibility: visible; }
  #lastActions button { font-size: 13px; padding: 4px 12px; }
  #lastActions button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  #bottom {
    display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 12px; padding-block: 0 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .card h2 button { font-size: 11px; padding: 2px 8px; text-transform: none; letter-spacing: 0; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 6px; text-align: right; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td:first-child, th:first-child { text-align: left; }
  #stats td:first-child { color: var(--muted); }
  #listWrap { max-height: 240px; overflow-y: auto; }
  #list tr:hover { background: var(--bg); }
  #list td.act { white-space: nowrap; }
  #list td.act button { font-size: 11px; padding: 1px 6px; margin-left: 2px; }
  #list td.act button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }

  #net { display: grid; grid-template-columns: repeat(4, auto); gap: 4px; justify-content: center; }
  .face { display: grid; gap: 2px; }
  .face div { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(0,0,0,.35); }
  .face.n2 div { width: 25px; height: 25px; }
  #netNote { color: var(--muted); text-align: center; font-size: 13px; padding: 30px 0; }

  body.solving header, body.solving #scrambleBar, body.solving #bottom, body.solving #hint, body.solving #lastActions { opacity: 0; pointer-events: none; }
  header, #scrambleBar, #bottom, #hint { transition: opacity .15s; }

  @media (max-width: 860px) {
    #bottom { grid-template-columns: 1fr; }
  }
  /* ---------- scenery background ---------- */
  :root { --glass: rgba(14, 18, 34, .58); --halo: rgba(6, 10, 30, .6); --scene: night; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --glass: rgba(255, 255, 255, .62); --halo: rgba(255, 255, 255, .85); --scene: day; }
  }
  :root[data-theme="light"] { --glass: rgba(255, 255, 255, .62); --halo: rgba(255, 255, 255, .85); --scene: day; }
  #scenery { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }
  body > *:not(.bg-layer):not(script) { position: relative; z-index: 1; }
  body:not(.canvas-scene) #scenery { display: none; }
  header, .card { background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #scramble, #hint {
    display: inline-block; background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-radius: 12px; padding: 6px 16px;
  }
  #time { text-shadow: 0 2px 24px var(--halo), 0 0 4px var(--halo); }
</style>
</head>
<body>
<canvas id="scenery" class="bg-layer" aria-hidden="true"></canvas>
<header>
  <h1>🧊 Cube Timer</h1>
  <div class="controls">
    <select id="puzzle" title="Puzzle">
      <option value="222">2x2</option>
      <option value="333" selected>3x3</option>
      <option value="444">4x4</option>
    </select>
    <label class="toggle"><input type="checkbox" id="inspection"> 15s inspection</label>
    <label class="toggle">Scene <select id="sceneSel" title="Background scene"></select></label>
  </div>
</header>

<div id="scrambleBar">
  <div id="scramble"></div>
  <div class="row">
    <button id="newScramble">New scramble</button>
    <button id="copyScramble">Copy</button>
  </div>
</div>

<div id="stage">
  <div id="time">0.00</div>
  <div id="lastActions">
    <button data-pen="ok">OK</button>
    <button data-pen="+2">+2</button>
    <button data-pen="dnf">DNF</button>
    <button data-pen="del">Delete</button>
  </div>
  <div id="hint">Hold <b>Space</b> (or touch &amp; hold) until green, release to start. Any key stops.</div>
</div>

<div id="bottom">
  <div class="card">
    <h2>Statistics</h2>
    <table id="stats"></table>
  </div>
  <div class="card">
    <h2>Solves <span><button id="exportBtn">Copy CSV</button> <button id="clearBtn">Clear session</button></span></h2>
    <div id="listWrap"><table id="list"></table></div>
  </div>
  <div class="card">
    <h2>Scramble preview</h2>
    <div id="net"></div>
    <div id="netNote" hidden>Preview available for 2x2 and 3x3.</div>
  </div>
</div>

<script>
(() => {
  // ---------- storage ----------
  const KEY = 'cube-timer-v1';
  let data = { puzzle: '333', inspection: false, solves: { '222': [], '333': [], '444': [] } };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); data = Object.assign(data, d); data.solves = Object.assign({ '222': [], '333': [], '444': [] }, d.solves); }
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };

  // ---------- cube model (3D stickers) ----------
  const N = { U: [0,1,0], D: [0,-1,0], R: [1,0,0], L: [-1,0,0], F: [0,0,1], B: [0,0,-1] };
  // net orientation per face: [right, down]
  const NET = {
    U: [[1,0,0],[0,0,1]], F: [[1,0,0],[0,-1,0]], R: [[0,0,-1],[0,-1,0]],
    B: [[-1,0,0],[0,-1,0]], L: [[0,0,1],[0,-1,0]], D: [[1,0,0],[0,0,-1]]
  };
  const COLOR = { U: '#ffffff', D: '#ffd500', F: '#00b14f', B: '#0051ba', R: '#e8112d', L: '#ff7a00' };
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const cross = (a, v) => [a[1]*v[2]-a[2]*v[1], a[2]*v[0]-a[0]*v[2], a[0]*v[1]-a[1]*v[0]];
  const add = (...vs) => vs.reduce((s, v) => [s[0]+v[0], s[1]+v[1], s[2]+v[2]], [0,0,0]);
  const mul = (v, k) => [v[0]*k, v[1]*k, v[2]*k];
  const gridPos = (f, i, j) => add(N[f], mul(NET[f][0], j-1), mul(NET[f][1], i-1));

  function solvedCube() {
    const s = [];
    for (const f in N) for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
      s.push({ p: gridPos(f, i, j), n: N[f].slice(), c: f });
    return s;
  }
  // clockwise quarter turn as seen from the face: v' = (v·a)a - a×v
  const rot = (v, a) => { const d = dot(v, a), c = cross(a, v); return [d*a[0]-c[0], d*a[1]-c[1], d*a[2]-c[2]]; };
  function turn(cube, face, times) {
    const a = N[face];
    for (const s of cube) if (dot(s.p, a) === 1)
      for (let t = 0; t < times; t++) { s.p = rot(s.p, a); s.n = rot(s.n, a); }
  }
  function applyAlg(cube, alg) {
    for (const m of alg.trim().split(/\s+/).filter(Boolean)) {
      const f = m[0], times = m.endsWith('2') ? 2 : m.endsWith("'") ? 3 : 1;
      if (N[f]) turn(cube, f, times);
    }
    return cube;
  }
  function faceColors(cube) {
    const map = new Map(cube.map(s => [s.p + '|' + s.n, s.c]));
    const out = {};
    for (const f in N) {
      out[f] = [];
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) out[f].push(map.get(gridPos(f, i, j) + '|' + N[f]));
    }
    return out;
  }

  // ---------- scrambles ----------
  const AXIS = { U: 'y', D: 'y', R: 'x', L: 'x', F: 'z', B: 'z', Uw: 'y', Rw: 'x', Fw: 'z' };
  const SUF = ['', "'", '2'];
  function genScramble(puzzle) {
    const cfg = {
      '222': { faces: ['R','U','F'], len: 9 + Math.floor(Math.random() * 3) },
      '333': { faces: ['U','D','R','L','F','B'], len: 20 + Math.floor(Math.random() * 2) },
      '444': { faces: ['U','D','R','L','F','B','Uw','Rw','Fw'], len: 40 },
    }[puzzle];
    const moves = [];
    while (moves.length < cfg.len) {
      const f = cfg.faces[Math.floor(Math.random() * cfg.faces.length)];
      const last = moves[moves.length - 1], prev = moves[moves.length - 2];
      if (last && last.f === f) continue;
      if (last && prev && AXIS[last.f] === AXIS[f] && AXIS[prev.f] === AXIS[f]) continue;
      moves.push({ f, s: SUF[Math.floor(Math.random() * 3)] });
    }
    return moves.map(m => m.f + m.s).join(' ');
  }

  // ---------- formatting & stats ----------
  const val = s => s.pen === 'dnf' ? Infinity : s.t + (s.pen === '+2' ? 2000 : 0);
  function fmt(ms) {
    if (ms == null) return '-';
    if (ms === Infinity) return 'DNF';
    const cs = Math.floor(ms / 10), m = Math.floor(cs / 6000), sec = Math.floor(cs / 100) % 60, c = cs % 100;
    const pad = n => String(n).padStart(2, '0');
    return m ? `${m}:${pad(sec)}.${pad(c)}` : `${sec}.${pad(c)}`;
  }
  const fmtSolve = s => s.pen === 'dnf' ? `DNF(${fmt(s.t)})` : fmt(val(s)) + (s.pen === '+2' ? '+' : '');
  function avgOf(vals) {
    const n = vals.length;
    const k = Math.ceil(n * 0.05);
    const mid = vals.slice().sort((a, b) => a - b).slice(k, n - k);
    if (mid.includes(Infinity)) return Infinity;
    return mid.reduce((a, b) => a + b, 0) / mid.length;
  }
  // average of n ending at index i (inclusive)
  function aoAt(solves, i, n) { return i + 1 < n ? null : avgOf(solves.slice(i + 1 - n, i + 1).map(val)); }
  function bestAo(solves, n) {
    let best = null;
    for (let i = n - 1; i < solves.length; i++) { const a = aoAt(solves, i, n); if (best == null || a < best) best = a; }
    return best;
  }

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const timeEl = $('time'), stage = $('stage'), scrambleEl = $('scramble'), lastActions = $('lastActions');
  let scramble = '';
  const solves = () => data.solves[data.puzzle];
  // second click within 3s confirms (browser confirm() dialogs are blocked in some viewers)
  function confirmClick(btn, label, fn) {
    if (btn.classList.contains('confirm')) { clearTimeout(btn._t); btn.classList.remove('confirm'); btn.textContent = btn._orig; fn(); return; }
    btn._orig = btn.textContent; btn.textContent = label; btn.classList.add('confirm');
    btn._t = setTimeout(() => { btn.classList.remove('confirm'); btn.textContent = btn._orig; }, 3000);
  }

  function newScramble() {
    scramble = genScramble(data.puzzle);
    scrambleEl.textContent = scramble;
    renderNet();
  }

  function renderNet() {
    const net = $('net'), note = $('netNote');
    net.innerHTML = '';
    if (data.puzzle === '444') { net.hidden = true; note.hidden = false; return; }
    net.hidden = false; note.hidden = true;
    const colors = faceColors(applyAlg(solvedCube(), scramble));
    const two = data.puzzle === '222';
    const place = { U: [1,2], L: [2,1], F: [2,2], R: [2,3], B: [2,4], D: [3,2] };
    for (const f of ['U','L','F','R','B','D']) {
      const el = document.createElement('div');
      el.className = 'face' + (two ? ' n2' : '');
      el.style.gridRow = place[f][0]; el.style.gridColumn = place[f][1];
      el.style.gridTemplateColumns = `repeat(${two ? 2 : 3}, auto)`;
      const idx = two ? [0, 2, 6, 8] : [0,1,2,3,4,5,6,7,8];
      for (const k of idx) { const d = document.createElement('div'); d.style.background = COLOR[colors[f][k]]; el.appendChild(d); }
      net.appendChild(el);
    }
  }

  function renderStats() {
    const s = solves(), vals = s.map(val), ok = vals.filter(v => v !== Infinity);
    const cur = n => s.length >= n ? aoAt(s, s.length - 1, n) : null;
    const rows = [
      ['Solves', `${ok.length} / ${s.length}`, ''],
      ['Best', fmt(ok.length ? Math.min(...ok) : null), ''],
      ['Mean', fmt(ok.length ? ok.reduce((a, b) => a + b, 0) / ok.length : null), ''],
      ['ao5', fmt(cur(5)), fmt(bestAo(s, 5))],
      ['ao12', fmt(cur(12)), fmt(bestAo(s, 12))],
      ['ao50', fmt(cur(50)), fmt(bestAo(s, 50))],
      ['ao100', fmt(cur(100)), fmt(bestAo(s, 100))],
    ];
    $('stats').innerHTML = '<tr><th></th><th>Current</th><th>Best</th></tr>' +
      rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  }

  function renderList() {
    const s = solves(), list = $('list');
    if (!s.length) { list.innerHTML = '<tr><td class="empty" colspan="5">No solves yet — go!</td></tr>'; return; }
    let html = '<tr><th>#</th><th>Time</th><th>ao5</th><th>ao12</th><th></th></tr>';
    for (let i = s.length - 1; i >= 0; i--) {
      const x = s[i];
      html += `<tr title="${x.scr}"><td>${i + 1}</td><td>${fmtSolve(x)}</td><td>${fmt(aoAt(s, i, 5))}</td><td>${fmt(aoAt(s, i, 12))}</td>
        <td class="act"><button data-i="${i}" data-pen="+2" class="${x.pen === '+2' ? 'on' : ''}">+2</button><button data-i="${i}" data-pen="dnf" class="${x.pen === 'dnf' ? 'on' : ''}">DNF</button><button data-i="${i}" data-pen="del">✕</button></td></tr>`;
    }
    list.innerHTML = html;
  }

  function renderLastActions() {
    const s = solves(), last = s[s.length - 1];
    lastActions.classList.toggle('show', !!last && state === 'idle' && justSolved);
    if (!last) return;
    for (const b of lastActions.querySelectorAll('button'))
      b.classList.toggle('on', b.dataset.pen === (last.pen || 'ok'));
  }

  function renderAll() { renderStats(); renderList(); renderLastActions(); }

  function setPenalty(i, pen) {
    const s = solves();
    if (!s[i]) return;
    if (pen === 'del') {
      s.splice(i, 1);
      if (i === s.length) { justSolved = false; timeEl.textContent = '0.00'; }
    } else {
      s[i].pen = (pen === 'ok' || s[i].pen === pen) ? '' : pen;
      if (i === s.length - 1 && justSolved) timeEl.textContent = fmtSolve(s[i]);
    }
    save(); renderAll();
  }

  // ---------- timer state machine ----------
  const HOLD_MS = 300;
  let state = 'idle';   // idle | inspect | running
  let holding = false, ready = false, holdTimer = null, ignoreRelease = false;
  let startT = 0, inspStart = 0, inspPenalty = '', raf = 0, justSolved = false;

  function setTimeClass(c) { timeEl.className = c || ''; }

  function press() {
    if (state === 'running') { stopSolve(); ignoreRelease = true; return; }
    if (holding) return;
    holding = true; ready = false;
    if (state === 'idle' && data.inspection) return; // inspection starts on release
    setTimeClass('hold');
    holdTimer = setTimeout(() => { ready = true; setTimeClass('ready'); if (state === 'idle') timeEl.textContent = '0.00'; }, HOLD_MS);
  }

  function release() {
    if (ignoreRelease) { ignoreRelease = false; holding = false; return; }
    if (!holding) return;
    holding = false; clearTimeout(holdTimer);
    if (state === 'idle' && data.inspection) { startInspection(); return; }
    if (ready) { ready = false; startSolve(); return; }
    setTimeClass(state === 'inspect' ? 'inspect' : '');
  }

  function startInspection() {
    state = 'inspect'; inspStart = performance.now(); justSolved = false;
    document.body.classList.add('solving'); renderLastActions();
    setTimeClass('inspect');
    const tick = () => {
      if (state !== 'inspect') return;
      const e = (performance.now() - inspStart) / 1000;
      if (!holding) timeEl.textContent = e < 15 ? String(15 - Math.floor(e)) : e < 17 ? '+2' : 'DNF';
      raf = requestAnimationFrame(tick);
    };
    tick();
  }

  function startSolve() {
    inspPenalty = '';
    if (state === 'inspect') {
      const e = performance.now() - inspStart;
      inspPenalty = e > 17000 ? 'dnf' : e > 15000 ? '+2' : '';
    }
    cancelAnimationFrame(raf);
    state = 'running'; justSolved = false; startT = performance.now();
    document.body.classList.add('solving'); renderLastActions();
    setTimeClass('');
    const tick = () => {
      if (state !== 'running') return;
      timeEl.textContent = fmt(performance.now() - startT);
      raf = requestAnimationFrame(tick);
    };
    tick();
  }

  function stopSolve() {
    const t = Math.round(performance.now() - startT);
    cancelAnimationFrame(raf);
    state = 'idle'; justSolved = true;
    document.body.classList.remove('solving');
    const solve = { t, pen: inspPenalty, scr: scramble, at: Date.now() };
    solves().push(solve); save();
    timeEl.textContent = fmtSolve(solve);
    setTimeClass('');
    newScramble(); renderAll();
  }

  function cancelAll() {
    cancelAnimationFrame(raf); clearTimeout(holdTimer);
    state = 'idle'; holding = false; ready = false;
    document.body.classList.remove('solving');
    setTimeClass(''); timeEl.textContent = '0.00';
  }

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && e.code === 'Space' && state === 'idle' && !holding)) {
      if (e.code !== 'Space') return;
      e.target.blur();
    }
    if (state === 'running') {
      if (['Shift','Control','Alt','Meta'].includes(e.key)) return;
      e.preventDefault(); if (!e.repeat) press(); return;
    }
    if (e.code === 'Escape') { if (state === 'inspect' || holding) cancelAll(); return; }
    if (e.code !== 'Space') return;
    e.preventDefault();
    if (e.target.tagName === 'BUTTON') e.target.blur();
    if (!e.repeat) press();
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space' || ignoreRelease) { e.preventDefault(); release(); }
  });

  // touch / mouse on the stage
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault(); press();
  });
  stage.addEventListener('pointerup', e => { if (!e.target.closest('button')) release(); });
  stage.addEventListener('pointercancel', () => { if (holding) { holding = false; clearTimeout(holdTimer); setTimeClass(state === 'inspect' ? 'inspect' : ''); } });
  // while solving the overlay hides everything; let a tap anywhere stop it
  document.addEventListener('pointerdown', e => {

  function city() {

      day: { sky: ['#4f97dc', '#9fcdf0', '#e4f0f8'], sun: '#fff8e6', glow: 'rgba(255,245,215,', bld: ['#b3c6de', '#8aa3c6', '#5f7da6'], win: ['rgba(235,245,255,.6)'], water: ['#8cbadf', '#3f6f9c'], bridge: '#2f405a', cable: '#4b5d7a', cloud: ['#ffffff', '#dbe6f5'], bird: '#2d3a50', shim: 'rgba(255,255,255,.55)', cars: ['#e8463b', '#f2f2f2', '#3a7bd5', '#f6c344', '#2d2d2d'] },
      night: { sky: ['#050a1d', '#121c45', '#3a2b62'], sun: '#eef0ff', glow: 'rgba(200,215,255,', bld: ['#1f2650', '#171d3d', '#0e1329'], win: ['#ffd27a', '#ffe7ad', '#a8dcff', '#ffd27a'], water: ['#1a2350', '#080c26'], bridge: '#070a18', cable: '#1a2140', cloud: ['#363a70', '#232755'], bird: '#000', shim: 'rgba(255,210,130,.55)' }
    };
    let S;
    const hz = () => H * 0.66, deckY = () => H * 0.84;
    function build() {
      const P = PAL[mode], h = hz(), s = Math.max(0.7, S0()), [sky, g] = canvas();
      skyGrad(g, P.sky, h);
      if (mode === 'day') disc(g, W * 0.8, H * 0.18, Math.min(W, H) * 0.045, P.sun, P.glow);
      else disc(g, W * 0.15, H * 0.14, Math.min(W, H) * 0.035, P.sun, P.glow, P.sky[1]);
      const [sk, k] = canvas(), tw = [], beacons = [];
      const ranges = [[0.18, 0.46], [0.1, 0.3], [0.04, 0.16]];
      ranges.forEach(([lo, hi], li) => {
        let x = -10;
        while (x < W + 10) {
          const w = rand(22, 60) * s * (li === 2 ? 1.4 : 1), tall = Math.random() < 0.12, bh = H * rand(lo, hi) * (tall ? 1.35 : 1), y = h - bh;
          k.fillStyle = P.bld[li]; k.fillRect(x, y, w, bh + 2);
          const top = Math.random();
          if (top < 0.25) k.fillRect(x + w * 0.2, y - bh * 0.06, w * 0.6, bh * 0.06);
          else if (top < 0.4) { k.beginPath(); k.moveTo(x, y); k.lineTo(x + w / 2, y - w * 0.5); k.lineTo(x + w, y); k.fill(); }
          if (tall || top > 0.85) { k.fillRect(x + w / 2 - 1, y - bh * 0.12, 2, bh * 0.12); beacons.push({ x: x + w / 2, y: y - bh * 0.12, ph: Math.random() * 6 }); }
          if (li > 0 || mode === 'night') {
            const cw = li === 0 ? 5 : 7, chh = li === 0 ? 7 : 9;
            for (let wx = x + 4; wx < x + w - 5; wx += cw) for (let wy = y + 6; wy < h - 4; wy += chh) {
              if (mode === 'night') {
                const rv = Math.random();
                if (rv < 0.3) { k.fillStyle = pick(P.win); k.globalAlpha = 0.5 + Math.random() * 0.5; k.fillRect(wx, wy, cw - 3, chh - 4); }
                else if (rv < 0.31 && tw.length < 120) tw.push({ x: wx, y: wy, w: cw - 3, h: chh - 4, c: pick(P.win), ph: Math.random() * 6, sp: rand(0.1, 0.4) });
              } else if ((Math.floor(wy / chh) + li) % 3 !== 0) { k.fillStyle = P.win[0]; k.globalAlpha = 0.35; k.fillRect(wx, wy, cw - 3, chh - 4); }
            }
            k.globalAlpha = 1;
          }
          x += w + rand(0, 6) * s;
        }
      });
      const [back, b] = canvas();
      b.drawImage(sk, 0, 0, W, H);
      const wg = b.createLinearGradient(0, h, 0, H); wg.addColorStop(0, P.water[0]); wg.addColorStop(1, P.water[1]);
      b.fillStyle = wg; b.fillRect(0, h, W, H - h);
      b.save(); b.beginPath(); b.rect(0, h, W, H - h); b.clip(); b.globalAlpha = mode === 'night' ? 0.4 : 0.25;
      b.translate(0, h); b.scale(1, -0.6); b.translate(0, -h); b.drawImage(sk, 0, 0, W, H); b.restore();
      // bridge
      const [front, f] = canvas(), d = deckY(), t1 = W * 0.22, t2 = W * 0.78, topY = d - H * 0.3, low = d - H * 0.03;
      f.fillStyle = P.bridge; f.fillRect(t1 - 7 * s, topY, 14 * s, H - topY); f.fillRect(t2 - 7 * s, topY, 14 * s, H - topY);
      f.fillRect(0, d, W, H * 0.022); f.fillRect(0, d - 4, W, 2);
      const cableY = x => x < t1 ? topY + (d - H * 0.06 - topY) * (1 - x / t1) ** 2 : x > t2 ? topY + (d - H * 0.06 - topY) * ((x - t2) / (W - t2)) ** 2 : low - (low - topY) * ((x - W / 2) / ((t2 - t1) / 2)) ** 2;
      f.strokeStyle = P.cable; f.lineWidth = 3; f.beginPath(); for (let x = 0; x <= W; x += 4) x ? f.lineTo(x, cableY(x)) : f.moveTo(x, cableY(x)); f.stroke();
      f.lineWidth = 1; f.beginPath(); for (let x = 6; x < W; x += 14) { f.moveTo(x, cableY(x)); f.lineTo(x, d); } f.stroke();
      const lights = [];
      if (mode === 'night') for (let x = 10; x < W; x += 30) lights.push(x);
      const cars = Array.from({ length: Math.round(W / 70) }, () => ({ x: Math.random() * W, dir: Math.random() < 0.5 ? 1 : -1, sp: rand(60, 110), c: mode === 'day' ? pick(P.cars) : null }));
      const plane = { x: -50, y: H * 0.12 };
      S = { sky, back, front, tw, beacons, lights, cars, plane, clouds: makeClouds(P.cloud, H * 0.03, H * 0.18, mode === 'day' ? 0.9 : 0.6), stars: mode === 'night' ? makeStars(90, h * 0.6) : [], birds: mode === 'day' ? makeBirds(5, H * 0.1, H * 0.3) : [] };
    }
    function frame(dt) {
      const P = PAL[mode], h = hz(), d = deckY(), s = Math.max(0.7, S0());
      ctx.drawImage(S.sky, 0, 0, W, H); drawStars(S.stars); drawClouds(S.clouds, dt);
      if (mode === 'night') {
        const pl = S.plane; pl.x += 22 * dt; if (pl.x > W + 50) { pl.x = -50; pl.y = rand(H * 0.06, H * 0.2); }
        ctx.fillStyle = Math.sin(t * 5) > 0.6 ? '#ff5050' : '#ffffff'; ctx.beginPath(); ctx.arc(pl.x, pl.y, 1.8, 0, 7); ctx.fill();
      }
      ctx.drawImage(S.back, 0, 0, W, H);
      for (const w of S.tw) if (Math.sin(t * w.sp + w.ph) > -0.2) { ctx.fillStyle = w.c; ctx.globalAlpha = 0.85; ctx.fillRect(w.x, w.y, w.w, w.h); }
      ctx.globalAlpha = 1;
      for (const bc of S.beacons) if (Math.sin(t * 2.5 + bc.ph) > 0.4) {
        const gr = ctx.createRadialGradient(bc.x, bc.y, 0, bc.x, bc.y, 7); gr.addColorStop(0, 'rgba(255,60,60,.95)'); gr.addColorStop(1, 'rgba(255,60,60,0)');
        ctx.fillStyle = gr; ctx.fillRect(bc.x - 7, bc.y - 7, 14, 14);
      }
      shimmer(h + 4, d - 6, 0, W, 60, P.shim, 0.7);
      ctx.drawImage(S.front, 0, 0, W, H);
      for (const x of S.lights) { ctx.fillStyle = 'rgba(255,215,140,.9)'; ctx.fillRect(x, d - 7, 2, 3); }
      for (const c of S.cars) {
        c.x += c.dir * c.sp * dt; if (c.x > W + 20) c.x = -20; if (c.x < -20) c.x = W + 20;
        const y = c.dir > 0 ? d + 2 : d + H * 0.012;
        if (mode === 'day') { ctx.fillStyle = c.c; rr(ctx, c.x, y, 12 * s, 5 * s, 2); ctx.fill(); }
        else { ctx.fillStyle = c.dir > 0 ? 'rgba(255,250,220,.95)' : 'rgba(255,70,70,.95)'; ctx.fillRect(c.x, y + 1, 10 * s, 2); ctx.fillStyle = c.dir > 0 ? 'rgba(255,250,220,.25)' : 'rgba(255,70,70,.25)'; ctx.fillRect(c.x - c.dir * 14 * s, y + 1, 14 * s, 2); }
      }
      drawBirds(S.birds, dt, P.bird);
    }
    return { build, frame };
  }

  // ---------- Tokyo dusk ----------
  function tokyo() {
    const PAL = {
      day: { sky: ['#6f86cf', '#e9a0a6', '#ffd6a0'], sun: '#ffe6b0', glow: 'rgba(255,200,140,', far: '#c88e9c', mid: '#9b6d88', near: '#5c4664', tower: '#e9573f', towerW: '#f5efe6', track: '#3b2f45', pole: '#2a2032', train: '#eef1f5', stripe: '#2fa05a', trainWin: '#8fb1c9', cloud: ['#ffe6d8', '#f0b2aa'], bird: '#2a2032', neonA: 0.35, win: ['rgba(255,230,190,.5)'] },
      night: { sky: ['#080c26', '#221a4a', '#552c5d'], sun: '#f4f1e2', glow: 'rgba(255,200,220,', far: '#1e1840', mid: '#151032', near: '#0c0a1e', tower: '#ff7a3d', towerW: '#ffd2a8', track: '#0a0816', pole: '#05040c', train: '#c9ced8', stripe: '#2fa05a', trainWin: '#ffe2a0', cloud: ['#3a2e66', '#2a2250'], bird: '#000', neonA: 1, win: ['#ffd27a', '#ffe7ad', '#a8dcff'] }
    };
    const NEON = ['#ff4fa3', '#4fd8ff', '#ffd84f', '#7dff6a', '#b06bff'];
    let S;
    const hz = () => H * 0.74, deck = () => H * 0.745;
    function skyline(g, lo, hi, col, wmin, wmax, wins, P, neon) {
      let x = -10; const s = Math.max(0.7, S0());
      while (x < W + 10) {
        const w = rand(wmin, wmax) * s, bh = H * rand(lo, hi), y = hz() - bh;
        g.fillStyle = col; g.fillRect(x, y, w, bh + 2);
        if (Math.random() < 0.3) g.fillRect(x + w * 0.3, y - 8 * s, w * 0.4, 8 * s);
        if (wins) for (let wx = x + 3; wx < x + w - 4; wx += 6) for (let wy = y + 5; wy < hz() - 3; wy += 8)
          if (Math.random() < (mode === 'night' ? 0.28 : 0.12)) { g.fillStyle = pick(P.win); g.globalAlpha = 0.4 + Math.random() * 0.5; g.fillRect(wx, wy, 3, 4); g.globalAlpha = 1; }
        if (neon && Math.random() < 0.55) {
          const vert = Math.random() < 0.6, nw = vert ? rand(8, 12) * s : rand(24, 40) * s, nh = vert ? rand(30, 60) * s : rand(9, 13) * s;
          neon.push({ x: x + (vert ? (Math.random() < 0.5 ? 2 : w - nw - 2) : (w - nw) / 2), y: y + rand(6, Math.max(8, bh * 0.5)), w: nw, h: nh, c: pick(NEON), ph: Math.random() * 6, vert });
        }
        x += w + rand(0, 4) * s;
      }
    }
    function tower(g, P) {
      const tx = W * 0.68, base = hz() - H * 0.02, Ht = H * 0.5, hw = f => Ht * 0.15 * (1 - f) ** 1.7 + Ht * 0.008;
      const edge = (f, side) => [tx + side * hw(f), base - f * Ht * 0.82];
      const poly = (f0, f1, col) => {
        g.fillStyle = col; g.beginPath();
        for (let f = f0; f <= f1 + 1e-6; f += 0.02) { const [x, y] = edge(Math.min(f, f1), -1); f === f0 ? g.moveTo(x, y) : g.lineTo(x, y); }
        for (let f = f1; f >= f0 - 1e-6; f -= 0.02) { const [x, y] = edge(Math.max(f, f0), 1); g.lineTo(x, y); }
        g.closePath(); g.fill();
      };
      if (mode === 'night') { const gl = g.createRadialGradient(tx, base - Ht * 0.45, 0, tx, base - Ht * 0.45, Ht * 0.6); gl.addColorStop(0, 'rgba(255,140,60,.25)'); gl.addColorStop(1, 'rgba(255,140,60,0)'); g.fillStyle = gl; g.fillRect(tx - Ht * 0.6, base - Ht * 1.05, Ht * 1.2, Ht * 1.2); }
      poly(0, 1, P.tower);
      for (const [a, b] of [[0.3, 0.35], [0.52, 0.56], [0.68, 0.71], [0.8, 0.83], [0.9, 0.92]]) poly(a, b, P.towerW);
      g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1;
      for (let f = 0.02; f < 0.95; f += 0.045) { const [ax, ay] = edge(f, -1), [bx, by] = edge(f + 0.045, 1), [cx, cy] = edge(f, 1), [dx, dy] = edge(f + 0.045, -1); g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.moveTo(cx, cy); g.lineTo(dx, dy); g.stroke(); }
      for (const [f, extra, hgt] of [[0.42, 0.035, 0.035], [0.74, 0.02, 0.025]]) {
        const [x0, y0] = edge(f, -1), w = 2 * hw(f) + Ht * extra * 2;
        g.fillStyle = P.towerW; g.fillRect(x0 - Ht * extra, y0 - Ht * hgt, w, Ht * hgt);
        g.fillStyle = mode === 'night' ? '#ffe6b0' : P.tower; g.fillRect(x0 - Ht * extra, y0 - Ht * hgt * 0.55, w, Ht * hgt * 0.25);
      }
      g.fillStyle = P.tower; g.fillRect(tx - 2, base - Ht, 4, Ht * 0.2);
      return { x: tx, y: base - Ht };
    }
    function build() {
      const P = PAL[mode], [sky, g] = canvas(), s = Math.max(0.7, S0());
      skyGrad(g, P.sky, hz());
      if (mode === 'day') disc(g, W * 0.3, H * 0.6, Math.min(W, H) * 0.07, P.sun, P.glow);
      else disc(g, W * 0.18, H * 0.15, Math.min(W, H) * 0.035, P.sun, P.glow, P.sky[1]);
      const [back, b] = canvas(), neon = [];
      skyline(b, 0.14, 0.32, P.far, 18, 40, false, P);
      const top = tower(b, P);
      skyline(b, 0.07, 0.18, P.mid, 30, 70, true, P);
      skyline(b, 0.03, 0.1, P.near, 40, 90, true, P, neon);
      const [front, f] = canvas(), dk = deck();
      f.fillStyle = P.track; f.fillRect(0, dk, W, H * 0.03); f.fillRect(0, dk - 3, W, 2);
      f.fillRect(0, dk + H * 0.03, W, H);
      for (let x = W * 0.06; x < W; x += W * 0.16) f.fillRect(x, dk, 16 * s, H);
      f.strokeStyle = P.pole; f.fillStyle = P.pole;
      const poles = [W * 0.1, W * 0.88], arms = [H * 0.16, H * 0.22];
      for (const px of poles) { f.fillRect(px - 5 * s, H * 0.1, 10 * s, H); for (const ay of arms) f.fillRect(px - 40 * s, ay, 80 * s, 5 * s); f.fillRect(px + 6 * s, H * 0.27, 18 * s, 26 * s); }
      f.lineWidth = 1.4;
      for (const ay of arms) for (const dx of [-36, 36]) {
        const y = ay + 2, sag = H * 0.06;
        f.beginPath(); f.moveTo(poles[0] + dx * s, y); f.quadraticCurveTo((poles[0] + poles[1]) / 2, y + sag * 2, poles[1] + dx * s, y); f.stroke();
        f.beginPath(); f.moveTo(-10, y + sag * 0.6); f.quadraticCurveTo(poles[0] / 2, y + sag * 0.5, poles[0] + dx * s, y); f.stroke();
        f.beginPath(); f.moveTo(poles[1] + dx * s, y); f.quadraticCurveTo((poles[1] + W) / 2, y + sag * 0.5, W + 10, y + sag * 0.6); f.stroke();
      }
      S = { sky, back, front, neon, top, train: { x: W * 0.6, wait: 0 }, clouds: makeClouds(P.cloud, H * 0.04, H * 0.25, mode === 'day' ? 0.85 : 0.6), stars: mode === 'night' ? makeStars(80, H * 0.45) : [], birds: mode === 'day' ? makeBirds(5, H * 0.12, H * 0.35) : [] };
    }
    function drawTrain(P, dt) {
      const tr = S.train, s = Math.max(0.7, S0()), carW = Math.max(90, W * 0.09), carH = Math.max(22, H * 0.035), n = 6, len = n * (carW + 4);
      if (tr.wait > 0) { tr.wait -= dt; return; }
      tr.x -= W * 0.2 * dt;
      if (tr.x < -len - 40) { tr.x = W + 40; tr.wait = rand(5, 9); return; }
      const y = deck() - carH - 3;
      for (let i = 0; i < n; i++) {
        const x = tr.x + i * (carW + 4);
        if (x > W + 10 || x + carW < -10) continue;
        ctx.fillStyle = P.train; rr(ctx, x, y, carW, carH, i === 0 ? carH * 0.45 : 4); ctx.fill();
        ctx.fillStyle = P.stripe; ctx.fillRect(x + (i === 0 ? carH * 0.3 : 0), y + carH * 0.68, carW - (i === 0 ? carH * 0.3 : 0), carH * 0.14);
        if (mode === 'night') { ctx.shadowColor = P.trainWin; ctx.shadowBlur = 8; }
        ctx.fillStyle = P.trainWin;
        for (let wx = x + 10 * s; wx < x + carW - 10 * s; wx += 14 * s) ctx.fillRect(wx, y + carH * 0.2, 9 * s, carH * 0.32);
        ctx.shadowBlur = 0;
      }
    }
    function frame(dt) {
      const P = PAL[mode];
      ctx.drawImage(S.sky, 0, 0, W, H); drawStars(S.stars); drawClouds(S.clouds, dt);
      ctx.drawImage(S.back, 0, 0, W, H);
      if (Math.sin(t * 2.2) > 0.3) { const gr = ctx.createRadialGradient(S.top.x, S.top.y, 0, S.top.x, S.top.y, 8); gr.addColorStop(0, 'rgba(255,60,60,.95)'); gr.addColorStop(1, 'rgba(255,60,60,0)'); ctx.fillStyle = gr; ctx.fillRect(S.top.x - 8, S.top.y - 8, 16, 16); }
      for (const n of S.neon) {
        const flick = Math.sin(t * 13 + n.ph * 7) > 0.97 ? 0.3 : 1;
        ctx.globalAlpha = P.neonA * (0.75 + 0.25 * Math.sin(t * 2 + n.ph)) * flick;
        if (mode === 'night') { ctx.shadowColor = n.c; ctx.shadowBlur = 14; }
        ctx.fillStyle = n.c; ctx.fillRect(n.x, n.y, n.w, n.h); ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        if (n.vert) for (let y = n.y + 4; y < n.y + n.h - 6; y += 10) ctx.fillRect(n.x + 2, y, n.w - 4, 5);
        else for (let x = n.x + 3; x < n.x + n.w - 5; x += 8) ctx.fillRect(x, n.y + 3, 5, n.h - 6);
      }
      ctx.globalAlpha = 1;
      drawTrain(P, dt);
      ctx.drawImage(S.front, 0, 0, W, H);
      drawBirds(S.birds, dt, P.bird);
    }
    return { build, frame };
  }

  // ---------- scene switching ----------
  const LIST = [['sakura', 'Sakura hills', sakura], ['ocean', 'Ocean shore', ocean], ['mountains', 'Mountain valley', mountains], ['forest', 'Forest waterfall', forest], ['city', 'City skyline', city], ['tokyo', 'Tokyo dusk', tokyo], ['off', 'Off', null]];
  const R = {};
  for (const [id, name, make] of LIST) {
    if (make) R[id] = make();
    const o = document.createElement('option'); o.value = id; o.textContent = name; sel.appendChild(o);
  }
  let scene = 'sakura';
  try {
    const saved = localStorage.getItem('cube-timer-scene');
    if (saved) scene = saved; else if (localStorage.getItem('cube-timer-scenery') === 'off') scene = 'off';
  } catch (e) {}
  if (!LIST.some(l => l[0] === scene)) scene = 'sakura';

  function paint(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
    cur.frame(dt);
  }
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; t += dt;
    paint(dt); raf = requestAnimationFrame(loop);
  }
  function start() {
    cancelAnimationFrame(raf);
    sel.value = scene;
    const off = scene === 'off';
    document.body.classList.toggle('no-scenery', off);
    document.body.classList.toggle('canvas-scene', !off);
    if (off) return;
    dpr = Math.min(window.devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    mode = getComputedStyle(document.documentElement).getPropertyValue('--scene').trim() === 'day' ? 'day' : 'night';
    cur = R[scene]; cur.build();
    if (reduce.matches || document.hidden) { paint(0); return; }
    last = performance.now(); raf = requestAnimationFrame(loop);
  }

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(start, 150); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else start(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', start);
  reduce.addEventListener('change', start);
  new MutationObserver(start).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  sel.addEventListener('change', () => {
    scene = sel.value; sel.blur();
    try { localStorage.setItem('cube-timer-scene', scene); } catch (e) {}
    start();
  });
  start();
})();
</script>
